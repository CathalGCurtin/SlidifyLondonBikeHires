name: Validate application and slides
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      RUN_BROWSER_TESTS: "true"
      NOT_CRAN: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'
          use-public-rspm: true
      - name: Restore dependencies into a fresh library without a package cache
        env:
          RENV_CONFIG_CACHE_ENABLED: "FALSE"
        run: Rscript -e 'renv::restore(prompt = FALSE)'
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.11.9'
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: Test historical data
        run: python3 scripts/validate_data.py
      - name: Test calculations and browser interactions
        env:
          CHROMOTE_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: Rscript scripts/test.R
      - name: Render and validate slides
        run: |
          quarto render index.qmd
          Rscript scripts/validate_slides.R
      - name: Smoke-test slide navigation and mobile layout
        env:
          CHROMOTE_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/slides-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          Rscript scripts/smoke_slides.R
      - uses: actions/upload-artifact@v4
        with:
          name: presentation
          path: Index.html
